name: Score stocks and publish site

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC = 6:30 pm New York in summer, 5:30 pm in winter
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]   # republish (without rescoring) when the pages change

permissions:
  contents: write   # to save each day's scores back into the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Score stocks
        if: github.event_name != 'push'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          ENABLE_SMART_MONEY: ${{ vars.ENABLE_SMART_MONEY || 'auto' }}
        run: python -m scoring.run

      - name: Save today's scores to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Daily scores $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
